<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitConnect</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css?v=4" />
    <link rel="icon" type="image/png" href="img/fitconnect-logo.png" />
    <link href="FitSocial.Client.styles.css?v=3" rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .boot-splash {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background-color: #edf1f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .boot-splash img {
            width: 88px;
            height: 88px;
            object-fit: contain;
        }
        .boot-brand {
            color: #1f2937;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .boot-spinner {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 4px solid #ffd9c7;
            border-top-color: #FF5722;
            animation: boot-spin 0.9s linear infinite;
        }
        .boot-splash p {
            color: #64748b;
            font-size: 0.85rem;
            margin: 0;
        }
        @keyframes boot-spin {
            to { transform: rotate(360deg); }
        }
        #blazor-error-ui {
            display: none;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="boot-splash">
            <img src="img/fitconnect-logo.png" alt="FitConnect" />
            <div class="boot-brand">FitConnect</div>
            <div class="boot-spinner"></div>
            <p>Loading FitConnect...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/googleAuth.js"></script>
    <script src="js/faceCapture.js"></script>
    <script src="js/mediaSlider.js?v=2.1"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
